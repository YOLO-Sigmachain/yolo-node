
# YOLO (SigmaChain) testnet config.
#
# Built on the in-tree Ergo testnet config (networkType = "testnet", block version 4 at genesis, address
# prefix 16), which is included first, so the file is complete whether or not the node is started with
# --testnet. Every value below overrides testnet.conf.
#
# Launch (from the repository root):
#   java -jar target/scala-2.12/ergo-<version>.jar --testnet -c src/main/resources/yolo-testnet.conf
# or
#   sbt "run --testnet -c src/main/resources/yolo-testnet.conf"
#
# Not final: genesis (emission and fund boxes, genesis state digest, genesisId) and seeds are not set yet, and the
# initial difficulty is a devnet placeholder. A node started on this file alone refuses to start (the genesis inputs
# are unset, see the note in ergo.chain.yolo below). Do not use this file to start a public network.

include classpath("testnet.conf")

ergo {
  networkType = "testnet"

  # Own data directory, so a YOLO node never opens an Ergo testnet database (".ergo")
  directory = ${user.dir}"/.yolo"
  directory = ${?DATADIR}

  node {
    # Synced if the best header is no more than headerChainDiff blocks from now (400 x 30 s = 200 min)
    headerChainDiff = 400

    # Mempool declines storage rent claim transactions (miners build their own)
    rejectStorageRentTxs = true

    # Maximum cost of a transaction the mempool accepts and relays (testnet.conf: 800,000). The block cost limit
    # is 1,500,000, set in the YOLO launch parameters; block assembly keeps 150,000 of it free (safe gap), and a
    # rent-collecting miner puts the emission transaction, a storage rent claim of up to 100 boxes and the fee
    # transaction in first, with 300,000 reserved for them: the claim is kept within a cost budget of 270,000
    # whatever tokens its boxes carry, and the rest covers the emission transaction (13,109 measured) and a fee
    # transaction collecting one or two fee boxes (12,189 measured for one). That leaves at least 1,050,000 for one
    # pool transaction, so a relayed transaction fits beside them at the cost this node measured for it. With the
    # YOLO switch on, a transaction is relayed only if its own cost plus what its fee outputs add to the fee
    # transaction (2,100 counted per fee output, about 2,090 measured) is within this value, and only if no fee
    # output carries a token; the value in use is never above two less than the 1,050,000 above for the block cost
    # limit in use, so a vote lowering that limit lowers it too. A node with the YOLO switch on warns at start when this
    # value is above 1,500,000 - 150,000 - 300,000 - 2 = 1,049,998, and checks again whenever votes change the block
    # cost limit.
    #
    # Block assembly with the YOLO switch on (node policy, not a chain rule): each pool transaction is held to the
    # cost this node recorded for it, plus a slack of a tenth and 5,000. One that does not fit is passed over without
    # being validated, so it never ends assembly (there is no skip count). One that goes over its recorded cost plus
    # slack at assembly, or fails there, is removed from the pool, and the boxes it spends are refused at admission
    # until they are spent in a block. A transaction spending a refused box is still admitted if it also spends a
    # plain key-signed box of its own (a P2PK box with its signature): protocol builders whose bots spend shared
    # contract boxes without a signature should add one when a box they spend is refused. Work on transactions that
    # end up out of a candidate is capped at 3,050,000 cost units per candidate, in three tiers by the transactions'
    # cost limits.
    maxTransactionCost = 1000000

    # Miner self-collection of storage rent into own candidates (attested by rule 308); requires extraIndex = true
    storageRentCollection = true
    extraIndex = true
    # the extra index refuses a pruned chain (ErgoSettingsReader), so keep every block, as application.conf does
    blocksToKeep = -1
    utxo.utxoBootstrap = false
  }

  chain {
    # Address prefix stays 16 on the YOLO testnet (from testnet.conf); YOLO mainnet will use 32.

    # 30 s target block interval
    blockInterval = 30s

    # With the YOLO switch on, difficulty is EIP-37 from genesis over 64-block epochs (32 minutes). No retarget
    # until parent height 128, so block 129 is the first retarget; then EIP-37 floored at difficulty 2.
    # The start-up check refuses any eip37EpochLength other than 64. epochLength, the epoch of the older difficulty
    # calculation, is not used with the switch on; it is set to the same value in place of testnet.conf's 128 so
    # the two cannot be confused. The voting epoch (voting.votingLength, 128 from testnet.conf) is a separate
    # setting and does not change.
    eip37EpochLength = 64
    epochLength = 64

    # Genesis difficulty. PLACEHOLDER, to be set before launch: "02" is the YOLO difficulty floor, the smallest value
    # the start-up check accepts (testnet.conf's "01" is refused). Suits a local devnet only (blocks 1 to 128 are
    # near-instant, then EIP-37 climbs at most 1.5x per epoch). The public testnet and mainnet value is a launch
    # setting, to be chosen before mainnet (30 x expected launch hashrate in H/s), and must be set before any
    # public genesis.
    initialDifficultyHex = "02"

    powScheme {
      powType = "autolykos"
      k = 32
      n = 26
      # pow_height = height / 4
      powHeightDivisor = 4
    }

    reemission {
      # EIP-27 re-emission never activates
      activationHeight = 2147483647
    }

    yolo {
      # YOLO switch: YOLO launch parameters, rules 110 and 125 from genesis,
      # soft-fork voting start height below
      enabled = true

      # First height at which the node may vote for a soft-fork
      softForkVotingStartHeight = 0

      # Genesis inputs (ergo.chain.yolo.emission). DELIBERATELY UNSET: the public testnet trees, NFT ids and signer
      # keys are not frozen yet, and the devnet trees (yolo-devnet.conf) hold test signer keys that must never reach
      # a public network. With enabled = true a node started on this file alone refuses to start and names the
      # missing fields. Set every field of ergo.chain.yolo.emission (see application.conf for the meaning of each,
      # and yolo-devnet.conf for a filled-in example), then compute genesisStateDigestHex.
    }
  }
}

scorex {
  network {
    # "YOLO" in ASCII
    magicBytes = [89, 79, 76, 79]

    bindAddress = "0.0.0.0:9120"

    nodeName = "yolo-"${scorex.network.appVersion}
    nodeName = ${?NODENAME}

    # YOLO seed nodes, none yet (replaces the Ergo testnet peers from testnet.conf)
    knownPeers = []
  }

  restApi {
    # Local interface only. The API key hash is the upstream default ("hello", from testnet.conf);
    # set your own apiKeyHash before binding the API to a public interface.
    bindAddress = "127.0.0.1:9153"
  }
}

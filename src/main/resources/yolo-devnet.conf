
# YOLO (SigmaChain) local devnet config: yolo-testnet.conf plus local-network settings and the devnet genesis inputs.
#
# Launch (from the repository root):
#   java -jar target/scala-2.12/ergo-<version>.jar --testnet -c src/main/resources/yolo-devnet.conf
#
# For several nodes on one machine, give each its own ergo.directory, scorex.network.bindAddress,
# scorex.restApi.bindAddress and knownPeers in a further file that includes this one.
#
# Any file that includes this one inherits allowTestSignerKeys = true (set below) and must set it back to false for
# anything other than a private devnet.
#
# Genesis difficulty comes from yolo-testnet.conf: "02", the YOLO difficulty floor. A CPU miner meets it at
# once, so the first retarget (block 129) is reached quickly; EIP-37 then climbs at most 1.5x per epoch.

include "yolo-testnet.conf"

ergo {
  chain {
    # Genesis state digest of the devnet genesis boxes below (the launch check refuses any other value and
    # prints the computed one)
    genesisStateDigestHex = "650a702c5d1d56d38063c64de26b568c63cb99eb8b337d0058decfb7162814df03"

    yolo {
      # DEVNET ONLY genesis inputs. The trees are compiled with the devnet NFT ids below, and the two fund
      # trees embed PUBLIC TEST signer keys (the 2-of-3 multisig of treasury_governance.es and lp_fund.es). Never
      # copy these values into a public network config.
      emission {
        # emission.es v1.4 (93 / 4 / 3 split) with emissionNftId
        emissionTreeHex = ""
        # treasury_accumulation.es with treasuryNftId
        treasuryAccumulationTreeHex = ""
        # lp_accumulation.es with lpNftId
        lpAccumulationTreeHex = ""
        # treasury_governance.es with treasuryNftId and the test signer keys
        treasuryFundTreeHex = ""
        # lp_fund.es with lpNftId and the test signer keys
        lpFundTreeHex = ""
        # blake2b256 of the ASCII strings "yolo-devnet-emission-nft", "yolo-devnet-treasury-nft", "yolo-devnet-lp-nft"
        emissionNftId = "44bc63258d371f08ba0ac4b87eb356cf8e84dbfa31afef89a5b4a953cabdad2a"
        treasuryNftId = "26adf62f0d439cd5cccaad2343e2768085d7def9a0230a9251ce8477581f9148"
        lpNftId = "d6f3e22aca5641481ec05e2f134f451bfe11e489820eb149181e59eae7ce6967"
        # 177,291,250 YOLO: the 177,291,450 YOLO schedule supply less the 100 YOLO placed in each fund box
        genesisValue = 177291250000000000
        # 100 YOLO each, the fund floor
        treasuryFundValue = 100000000000
        lpFundValue = 100000000000
        lpWhitelist = []
        # The two fund trees above hold the public test signer keys; without this the launch check refuses them.
        # Devnet only: never set it on a public network
        allowTestSignerKeys = true
      }
    }
  }
}

scorex {
  network {
    # Accept peers on local addresses (devnet only)
    allowLocal = true

    # No seeds on a local devnet
    knownPeers = []
  }
}

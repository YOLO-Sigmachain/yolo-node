
# YOLO (SigmaChain) local devnet config: yolo-testnet.conf plus local-network settings.
#
# Launch (from the repository root):
#   java -jar target/scala-2.12/ergo-<version>.jar --testnet -c src/main/resources/yolo-devnet.conf
#
# For several nodes on one machine, give each its own ergo.directory, scorex.network.bindAddress,
# scorex.restApi.bindAddress and knownPeers in a further file that includes this one.

include "yolo-testnet.conf"

scorex {
  network {
    # Accept peers on local addresses (devnet only)
    allowLocal = true

    # No seeds on a local devnet
    knownPeers = []
  }
}
